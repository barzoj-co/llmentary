name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codegen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: "1.26.10"
          cache: true
      - name: Verify spec pin, regenerate, and fail on drift
        run: make codegen-check
      - name: A2 proof — hand-edit of gen.go is detected
        run: bash scripts/prove-a2.sh
      - name: A5 proof — missing StrictServerInterface method fails the build
        run: bash scripts/prove-a5.sh
      - name: A6 proof — stale relax-overlay embed is detected
        run: bash scripts/prove-a6.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: "1.26.10"
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: "1.26.10"
          cache: true
      - name: go build and vet
        run: |
          go build ./...
          go vet ./...
          (cd tests/proxy && go build ./... && go vet ./...)
          (cd tests/e2e && go build ./... && go vet -tags=e2e ./...)
      - name: go mod tidy is clean
        run: |
          go mod tidy
          (cd tests/proxy && go mod tidy)
          (cd tests/e2e && go mod tidy)
          git diff --exit-code
      - name: Unit tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage-unit.out ./...
      - name: Proxy fixture tests with coverage
        working-directory: tests/proxy
        run: go test -covermode=atomic -coverpkg=github.com/barzoj-co/llmentary/... -coverprofile=coverage-proxy.out ./...
      - name: Upload unit coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          disable_search: true
          use_oidc: false
          files: ./coverage-unit.out
          flags: unit
          fail_ci_if_error: ${{ vars.CODECOV_REQUIRED == 'true' }}
      - name: Upload proxy coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          disable_search: true
          use_oidc: false
          files: ./tests/proxy/coverage-proxy.out
          flags: proxy
          fail_ci_if_error: ${{ vars.CODECOV_REQUIRED == 'true' }}
      - name: Coverage gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/coverage-gate.sh coverage-unit.out tests/proxy/coverage-proxy.out

  docs-mermaid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=npm depName=@mermaid-js/mermaid-cli
      MERMAID_CLI_VERSION: "11.12.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install mermaid-cli
        run: npm install -g "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}"
      - name: Check mermaid diagrams
        timeout-minutes: 5
        run: bash scripts/check-mermaid.sh --self-test

  e2e:
    # Maintainers approve this environment on each run that needs OPENAI_API_KEY.
    environment: openai-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Live e2e once per change: pull_request (non-fork) or push to main.
    # Do not also run on push of the PR branch (that would double-bill OpenAI).
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    env:
      OPENAI_E2E_MODEL: ${{ vars.OPENAI_E2E_MODEL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: "1.26.10"
          cache: true
      - name: Download modules
        working-directory: tests/e2e
        run: go mod download
      - name: Compile e2e tests
        working-directory: tests/e2e
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-bin"
          go test -tags=e2e -c -o "$RUNNER_TEMP/e2e-bin/" ./...
      - name: Require OPENAI_API_KEY
        env:
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "${HAS_OPENAI_API_KEY}" != "true" ]; then echo "::error::OPENAI_API_KEY is required for non-fork e2e runs"; exit 1; fi
      - name: Run e2e tests
        working-directory: tests/e2e
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: go test -v -tags=e2e ./...

  e2e-gate:
    name: e2e-gate
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require live e2e success
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: bash scripts/e2e-gate.sh

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: "1.26.10"
          cache: true
      - name: Spec validation perf budgets
        working-directory: tests/proxy
        env:
          GOMAXPROCS: "2"
        run: go test -count=1 -timeout 15m -tags=perf -v -run 'TestI2|TestI3|TestI4|TestI5|TestG4' .
