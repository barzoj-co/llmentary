name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    uses: ./.github/workflows/goreleaser.yml
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
