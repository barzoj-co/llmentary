name: Feature request
description: Suggest a change to the llmentary proxy
title: "[feat] "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: clients
    attributes:
      label: Which client(s) it affects
      multiple: true
      options:
        - None / proxy only
        - Go (llmentary-go)
        - Python (llmentary-python)
        - JS/TS (llmentary-js)
        - Unsure
    validations:
      required: true
