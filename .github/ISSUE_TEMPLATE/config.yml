blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/barzoj-co/llm-test-lab/security/advisories/new
    about: Private vulnerability reports. Do not open a public issue.
  - name: Questions and ideas
    url: https://github.com/barzoj-co/llm-test-lab/discussions
    about: Ask questions and share ideas in Discussions (once the repository is public).
  - name: Go client issue
    url: https://github.com/barzoj-co/llm-test-lab-go/issues
    about: Bugs or features in the Go client (llm-test-lab-go).
  - name: Python client issue
    url: https://github.com/barzoj-co/llm-test-lab-python/issues
    about: Bugs or features in the Python client (llm-test-lab-python).
  - name: JavaScript client issue
    url: https://github.com/barzoj-co/llm-test-lab-js/issues
    about: Bugs or features in the JS/TS client (llm-test-lab-js).
