blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/barzoj-co/llmentary/security/advisories/new
    about: Private vulnerability reports. Do not open a public issue.
  - name: Questions and ideas
    url: https://github.com/barzoj-co/llmentary/discussions
    about: Ask questions and share ideas in Discussions (once the repository is public).
  - name: Go client issue
    url: https://github.com/barzoj-co/llmentary-go/issues
    about: Bugs or features in the Go client (llmentary-go).
  - name: Python client issue
    url: https://github.com/barzoj-co/llmentary-python/issues
    about: Bugs or features in the Python client (llmentary-python).
  - name: JavaScript client issue
    url: https://github.com/barzoj-co/llmentary-js/issues
    about: Bugs or features in the JS/TS client (llmentary-js).
