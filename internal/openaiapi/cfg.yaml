# oapi-codegen config. Version is pinned via the Go tool directive in go.mod
# (github.com/oapi-codegen/oapi-codegen/v2 v2.8.0). Do not use @latest.
package: openaiapi
output: internal/openaiapi/gen.go
generate:
  std-http-server: true
  strict-server: true
  models: true
output-options:
  # The input is already a filtered sub-spec; do not drop remaining schemas
  # (oapi-codegen prune has dropped discriminator-adjacent types before).
  skip-prune: true
  overlay:
    # Path is relative to the repository root (make gen / go generate cwd).
    path: api/openai/overlay.yaml
