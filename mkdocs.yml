# Docs site for https://barzoj-co.github.io/llmentary/ (built by .github/workflows/docs.yml).
# Local preview: pip install --require-hashes -r website/requirements.txt && mkdocs serve
site_name: llmentary
site_description: Integration tests for LLM apps that assert on recorded requests and responses.
site_url: https://barzoj-co.github.io/llmentary/
repo_url: https://github.com/barzoj-co/llmentary
repo_name: barzoj-co/llmentary
edit_uri: edit/main/docs/
copyright: llmentary proxy AGPL-3.0 &middot; clients MIT

docs_dir: docs
site_dir: site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/extra.css

hooks:
  - website/hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - Python: getting-started/python.md
      - TypeScript: getting-started/typescript.md
      - Go: getting-started/go.md
  - How-to guides:
      - Connect an existing app: how-to/connect-an-app.md
      - Test one turn of a conversation: how-to/scope-a-turn.md
      - Assert on model output: how-to/model-output.md
      - Run against a service in another process: black-box.md
      - Use another provider: providers.md
      - OpenAI-compatible providers: openai-compatible.md
      - Run in GitHub Actions: ci.md
      - Export traces as OpenTelemetry: otel.md
      - Troubleshooting: troubleshooting.md
  - Concepts: concepts.md
  - Reference:
      - Assertions: reference/assertions.md
      - Proxy flags and control API: proxy.md
      - Recorded data model: data-model.md
      - Session lifecycle: session-lifecycle.md
      - Isolation rules: isolation-spec.md
      - Client contract: client-contract.md
      - Provider compatibility matrix: compat-matrix.md
      - Release binaries: binaries.md
  - Contributing:
      - contributing.md
      - Releasing: releasing.md

not_in_nav: |
  /quickstart/
  /assertions-guide.md
  /reference/clients.md
