version: 2

project_name: llm-test-lab

before:
  hooks:
    - go mod tidy
    - sh -c "cd tests/proxy && go mod tidy"
    - sh -c "cd tests/e2e && go mod tidy"
    - go test ./...
    - sh -c "cd tests/proxy && go test ./..."

builds:
  - id: llmtestlab
    main: ./cmd/llmtestlab
    binary: llmtestlab
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: binaries
    ids:
      - llmtestlab
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - LICENSING.md
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
